name: Build

# Every push to main is built and checked. A GitHub Release gets the apps attached only when
# a version is released: push a tag like v1.0.1, or publish a release named v1.0.1 on GitHub.
#
# Early access: every newly published version starts as a pre-release. People with "Get early
# updates" on get it straight away; promote.yml makes it a normal release 24 hours later.
# Put [stable] in the release title to release to everyone at once.
#
# Rebuild: Actions → Build → Run workflow → enter an existing tag (e.g. v1.0.3) to move that
# version to the latest code and replace its files, without making a new version number.
on:
  push:
    branches: [main]
    tags: ['v*']
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version to rebuild from the latest code (for example v1.0.3)"
        required: true

env:
  # v1.2.3 tag (or a rebuild of it) → 1.2.3; anything else is a dev build that never becomes a release.
  VERSION: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || format('0.0.{0}', github.run_number) }}

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Use the permanent signing key (if the secrets are set)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        if: env.KEYSTORE_B64 != ''
        run: |
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pixlink.jks"
          echo "SIGN_ARGS=-PpixlinkKeystore=$RUNNER_TEMP/pixlink.jks -PpixlinkKeystorePassword=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Releases must use the permanent signing key
        # Phones only auto-update to an APK signed with the same key, so never release without it.
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.tag) && env.SIGN_ARGS == ''
        run: |
          echo "::error::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (Settings → Secrets and variables → Actions), then re-run this release."
          exit 1
      - name: Build release APK
        run: |
          V="${VERSION#v}"
          ./gradlew assembleRelease --stacktrace -PversionCode=${{ github.run_number }} -PversionName="$V" $SIGN_ARGS
      - uses: actions/upload-artifact@v4
        with:
          name: pixlink-android
          path: android/app/build/outputs/apk/release/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        shell: pwsh
        # MSBuild (not dotnet build) so WinUI XAML errors are reported with file and line.
        run: |
          $v = "$env:VERSION".TrimStart('v')
          # Package downloads occasionally fail on the build servers; try the restore a few times.
          for ($i = 1; $i -le 3; $i++) {
            msbuild windows/Pixlink/Pixlink.csproj /t:Restore /p:Configuration=Release /p:Platform=x64 /v:minimal
            if ($LASTEXITCODE -eq 0) { break }
            Write-Host "Restore failed (attempt $i), retrying…"; Start-Sleep -Seconds 15
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          msbuild windows/Pixlink/Pixlink.csproj /p:Configuration=Release /p:Platform=x64 /p:Version=$v /v:minimal
      - name: Find the app folder
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse windows/Pixlink/bin -Filter Pixlink.exe | Select-Object -First 1
          "APP_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $iscc = Get-ChildItem "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" -ErrorAction SilentlyContinue
            if (-not $iscc) { choco install innosetup -y --no-progress | Out-Null; $iscc = Get-Item "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" }
          }
          $env:PIXLINK_VERSION = "$env:VERSION".TrimStart('v')
          & ($iscc.Source ?? $iscc.FullName) windows/installer/Pixlink.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v4
        with:
          name: pixlink-windows-x64
          path: ${{ env.APP_DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: pixlink-windows-setup
          path: windows/installer/Pixlink-Setup-x64.exe

  ios:
    # Pixlink for iPhone, as an .ipa to install with AltStore or Sideloadly (they sign it with
    # your own Apple ID). Fake-signed here so the App Group entitlement the casting extension
    # needs is kept.
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build
        run: |
          V="${VERSION#v}"
          xcodebuild -project Pixlink.xcodeproj -target Pixlink -configuration Release -sdk iphoneos \
            SYMROOT="$PWD/build" MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package Pixlink-iOS.ipa
        run: |
          APP=build/Release-iphoneos/Pixlink.app
          codesign -f -s - --entitlements Broadcast/Broadcast.entitlements "$APP/PlugIns/PixlinkBroadcast.appex"
          codesign -f -s - --entitlements Pixlink/Pixlink.entitlements "$APP"
          mkdir -p Payload && cp -R "$APP" Payload/
          zip -qry Pixlink-iOS.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: pixlink-ios
          path: ios/Pixlink-iOS.ipa

  release:
    # Only version tags (or a rebuild of one) become releases. The iPhone app is attached when it
    # builds, but never holds up a Pixel/Windows release.
    if: always() && (startsWith(github.ref, 'refs/tags/v') || inputs.tag) && needs.android.result == 'success' && needs.windows.result == 'success'
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Move the tag to this build (rebuilds only)
        if: inputs.tag
        uses: actions/checkout@v4
      - if: inputs.tag
        run: |
          git tag -f "${{ inputs.tag }}"
          git push -f origin "refs/tags/${{ inputs.tag }}"
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release notes
        run: |
          if [ -f "${{ github.workspace }}/notes/${{ inputs.tag || github.ref_name }}.md" ]; then cp "notes/${{ inputs.tag || github.ref_name }}.md" release-notes.md; else echo "Bug fixes and improvements." > release-notes.md; fi
      - name: Package files
        run: |
          cp dist/pixlink-android/*.apk Pixlink-android.apk
          (cd dist/pixlink-windows-x64 && zip -qr ../../Pixlink-windows-x64.zip .)
          cp dist/pixlink-windows-setup/Pixlink-Setup-x64.exe Pixlink-Setup-x64.exe
          if [ -f dist/pixlink-ios/Pixlink-iOS.ipa ]; then cp dist/pixlink-ios/Pixlink-iOS.ipa Pixlink-iOS.ipa; fi
          # Portable: same app plus a marker that keeps settings in a Data folder next to Pixlink.exe.
          printf 'Pixlink portable\r\n\r\nPixlink keeps its settings in the Data folder next to this file, so you can run it from a USB stick.\r\nDelete this file to use the normal location (%%LOCALAPPDATA%%\\Pixlink) instead.\r\n' > dist/pixlink-windows-x64/portable.txt
          (cd dist/pixlink-windows-x64 && zip -qr ../../Pixlink-windows-x64-portable.zip .)
      # Rebuild of an existing version: replace its files (re-creating the release if it was deleted).
      - if: inputs.tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: Pixlink ${{ inputs.tag }}
          overwrite_files: true
          make_latest: true
          prerelease: false
          body_path: release-notes.md
          files: |
            Pixlink-android.apk
            Pixlink-Setup-x64.exe
            Pixlink-windows-x64-portable.zip
            Pixlink-windows-x64.zip
            Pixlink-iOS.ipa


      - if: ${{ !inputs.tag }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Pixlink ${{ github.ref_name }}
          # Every new version starts as early access (a pre-release); promote.yml makes it a normal
          # release for everyone 24 hours later. Put [stable] in the release title to skip early access.
          prerelease: ${{ !contains(github.event.release.name || '', '[stable]') }}
          make_latest: ${{ contains(github.event.release.name || '', '[stable]') }}
          overwrite_files: true
          append_body: true
          body: |
            ## Install
            - **Pixel:** download `Pixlink-android.apk` on your phone and open it.
            - **Windows (installer):** download `Pixlink-Setup-x64.exe` and run it. No admin needed; it adds Start menu and desktop shortcuts and an uninstaller.
            - **iPhone:** download `Pixlink-iOS.ipa` and install it with AltStore or Sideloadly (free, signs it with your Apple ID).
            - **Windows (portable):** download `Pixlink-windows-x64-portable.zip`, extract it anywhere (even a USB stick) and run `Pixlink.exe`. Settings stay in its own folder.

            Full steps: https://github.com/FatalQuackers/pixlink#how-to-install

            Already have Pixlink? Both apps update themselves: look for the update banner.
          files: |
            Pixlink-android.apk
            Pixlink-Setup-x64.exe
            Pixlink-windows-x64-portable.zip
            Pixlink-windows-x64.zip
            Pixlink-iOS.ipa

  pages:
    # Publishes website/ to GitHub Pages, plus an unlisted test page with the latest builds at
    # /test/<TEST_PAGE_SLUG>/ (only if that secret is set). It isn't linked anywhere and asks search
    # engines not to index it: share the link with testers.
    if: always() && github.ref == 'refs/heads/main'
    needs: [android, windows, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    continue-on-error: true
    env:
      SLUG: ${{ secrets.TEST_PAGE_SLUG }}
    steps:
      - uses: actions/checkout@v4
      - name: Download the builds
        if: env.SLUG != ''
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Build the test builds page
        if: env.SLUG != ''
        run: |
          out="website/test/$SLUG"
          mkdir -p "$out"
          [ -d dist/pixlink-ios ] && cp dist/pixlink-ios/*.ipa "$out/Pixlink-iOS.ipa"
          [ -d dist/pixlink-windows-setup ] && cp dist/pixlink-windows-setup/*.exe "$out/Pixlink-Setup-x64.exe"
          [ -d dist/pixlink-android ] && cp dist/pixlink-android/*.apk "$out/Pixlink-android.apk"
          sed -e "s/{{BUILD}}/${{ github.run_number }}/g" -e "s/{{DATE}}/$(date -u '+%-d %b %Y %H:%M UTC')/g" \
              -e "s/{{COMMIT}}/${GITHUB_SHA::7}/g" .github/test-page.html > "$out/index.html"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
          name: github-pages-${{ github.run_attempt }}
      # The artifact list can lag a few seconds behind the upload.
      - run: sleep 15
      - uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
