name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace -PversionCode=${{ github.run_number }} -PversionName=0.1.${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: pixlink-android-debug
          path: android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: microsoft/setup-msbuild@v2
      - name: Build
        # MSBuild (not dotnet build) so WinUI XAML errors are reported with file and line.
        run: msbuild windows/Pixlink/Pixlink.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:Version=0.1.${{ github.run_number }} /v:minimal
      - name: Find the app folder
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse windows/Pixlink/bin -Filter Pixlink.exe | Select-Object -First 1
          "APP_DIR=$($exe.DirectoryName)" >> $env:GITHUB_ENV
      - uses: actions/upload-artifact@v4
        with:
          name: pixlink-windows-x64
          path: ${{ env.APP_DIR }}

  pages:
    # Publishes website/ to GitHub Pages once Pages is enabled (Settings → Pages → Source: GitHub Actions).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: website
      - uses: actions/deploy-pages@v4

  release:
    # Publishes each build on main as the latest release, so the README install links always work.
    if: github.ref == 'refs/heads/main'
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Package files
        run: |
          cp dist/pixlink-android-debug/*.apk Pixlink-android.apk
          (cd dist/pixlink-windows-x64 && zip -qr ../../Pixlink-windows-x64.zip .)
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Pixlink 0.1.${{ github.run_number }} (preview)
          make_latest: true
          body: |
            Early preview build. See the README for install steps:
            https://github.com/FatalQuackers/pixlink#how-to-install
          files: |
            Pixlink-android.apk
            Pixlink-windows-x64.zip
