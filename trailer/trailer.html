<!doctype html>
<html><head><meta charset="utf-8"><title>Pixlink trailer</title>
<style>
:root{--navy:#16213A;--blue:#3D7BFF;--deep:#2557D6;--sky:#E8EEF8;--mint:#C9F0DE;--slate:#4A5675;--line:#CDD7EA;--green:#1E9E63;--red:#E5484D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{overflow:hidden;background:#fff}
body{font-family:'Inter Display','Inter',sans-serif;color:var(--navy);-webkit-font-smoothing:antialiased}
.a{position:absolute}
#stage{position:absolute;left:0;top:0;overflow:hidden;background:#F6F8FD}
.glow{position:absolute;border-radius:50%}
.title{position:absolute;left:0;width:100%;text-align:center;font-weight:700;letter-spacing:-0.035em;line-height:1.02}
.cap{position:absolute;text-align:center;font-weight:650;letter-spacing:-0.025em;line-height:1.08}
/* laptop */
.lapframe{background:#1B2132;border-radius:22px 22px 8px 8px;box-shadow:0 40px 80px -30px rgba(22,33,58,.45)}
.lapscreen{position:relative;overflow:hidden;border-radius:6px;background:#dfe8fb}
.lapbase{background:linear-gradient(#E4E8F0,#B8C0CF);border-radius:2px 2px 18px 18px;box-shadow:0 18px 30px -18px rgba(22,33,58,.5)}
.lapbase:after{content:'';position:absolute;left:42%;width:16%;height:35%;top:0;background:#C9D0DC;border-radius:0 0 10px 10px}
.phframe{background:#141824;box-shadow:0 40px 80px -30px rgba(22,33,58,.5)}
.phscreen{position:relative;overflow:hidden;background:#F7F9FF}
/* laptop internals (1000x625) */
#lin{position:absolute;left:0;top:0;width:1000px;height:625px;transform-origin:0 0;font-family:'Inter','Inter Display',sans-serif}
.wall{position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,#BBD2FF 0,transparent 45%),radial-gradient(circle at 85% 80%,#C9F0DE 0,transparent 40%),linear-gradient(135deg,#DCE7FF,#EEF3FF)}
#win{position:absolute;left:40px;top:28px;width:920px;height:548px;background:#FBFCFE;border-radius:10px;box-shadow:0 18px 40px -14px rgba(22,33,58,.35);overflow:hidden}
.tbar{height:34px;display:flex;align-items:center;gap:8px;padding:0 14px;font-size:12px;color:var(--slate);border-bottom:1px solid #EDF0F6}
.tbar img{width:16px;height:16px;border-radius:4px}
.tbar .dots{margin-left:auto;display:flex;gap:18px;color:#8A93A8;font-size:13px}
.layer{position:absolute}
.side{left:0;top:34px;width:250px;height:514px;background:#F3F6FB;border-right:1px solid #E7EBF3}
.tile{position:absolute;width:105px;height:58px;border-radius:10px;background:#E8EDF7;padding:9px 10px;font-size:11.5px;font-weight:600;color:var(--navy)}
.tile i{display:block;width:16px;height:16px;border-radius:5px;background:#B9C6E2;margin-bottom:6px}
.tabs{position:absolute;left:250px;top:34px;width:670px;height:44px;border-bottom:1px solid #EDF0F6;font-size:13px;font-weight:600;color:#7C86A0}
.tabs span{position:absolute;top:14px}
#tabLine{position:absolute;bottom:-1px;height:3px;border-radius:3px;background:var(--blue)}
.panel{left:250px;top:78px;width:670px;height:470px}
.h{font-size:18px;font-weight:700;letter-spacing:-.01em}
.card{position:absolute;left:24px;width:622px;background:#fff;border:1px solid #E7EBF3;border-radius:12px;box-shadow:0 2px 6px rgba(22,33,58,.05);overflow:hidden}
.av{position:absolute;width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:15px}
.meta{font-size:11px;color:#7C86A0}
.ct{font-size:14px;font-weight:700}
.cx{font-size:13px;color:#33405E}
.bub{position:absolute;padding:8px 13px;border-radius:14px;font-size:13px;max-width:330px;white-space:nowrap}
.btn{position:absolute;height:32px;border-radius:16px;border:1px solid #D5DCEA;background:#fff;font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:6px;padding:0 14px;white-space:nowrap}
.taskbar{position:absolute;left:0;top:585px;width:1000px;height:40px;background:rgba(243,246,252,.92);border-top:1px solid rgba(22,33,58,.08)}
.tb-ico{position:absolute;top:9px;width:22px;height:22px;border-radius:6px}
/* phone internals (300x640) */
#pin{position:absolute;left:0;top:0;width:300px;height:640px;transform-origin:0 0;font-family:'Inter','Inter Display',sans-serif}
.sbar{position:absolute;left:0;top:0;width:300px;height:26px;font-size:11px;font-weight:600;padding:7px 18px;display:flex;justify-content:space-between;z-index:5}
.home{background:radial-gradient(circle at 30% 20%,#9DBBFF,transparent 60%),radial-gradient(circle at 80% 85%,#BDEBD5,transparent 55%),linear-gradient(160deg,#C7D8FF,#E9F0FF)}
.appi{position:absolute;width:48px;height:48px;border-radius:16px}
.key{position:absolute;width:76px;height:50px;border-radius:25px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:500;color:var(--navy)}
.qs{position:absolute;width:128px;height:56px;border-radius:28px;background:#DEE5F4;font-size:12px;font-weight:600;padding:11px 0 0 52px;color:var(--navy)}
.qs i{position:absolute;left:16px;top:16px;width:24px;height:24px;border-radius:50%;background:#B7C3DE}
.qs small{display:block;font-weight:500;font-size:10.5px;color:#5A6680;margin-top:1px}
.row{position:absolute;left:0;width:300px;height:64px;padding:14px 0 0 62px;font-size:14px;font-weight:600}
.row i{position:absolute;left:18px;top:18px;width:28px;height:28px;border-radius:50%}
.row small{display:block;font-size:11.5px;font-weight:500;color:#6A7590;margin-top:2px}
.pcCard{position:absolute;left:16px;width:268px;height:74px;border-radius:20px;background:#fff;box-shadow:0 2px 8px rgba(22,33,58,.07);padding:15px 0 0 64px;font-size:14px;font-weight:700}
.pcCard small{display:block;font-weight:500;font-size:12px;color:var(--green);margin-top:3px}
.pcCard i{position:absolute;left:16px;top:20px;width:34px;height:24px;border:3px solid var(--navy);border-radius:4px}
.photo{position:absolute;border-radius:8px}
#cur{position:absolute;left:0;top:0;width:22px;height:28px;z-index:50;pointer-events:none}
.ripple{position:absolute;border-radius:50%;background:rgba(61,123,255,.28)}
</style></head>
<body>
<div id="stage"></div>
<script>
const Q=new URLSearchParams(location.search);
const F=Q.get('f')||'wide';
const L=F==='wide'
 ?{W:1920,H:1080,capY:135,capS:54,capW:1700,lap:{x:250,y:250,w:1100},ph:{x:1440,y:292,w:290},tS:112,tY:420,subS:44,tall:false}
 :{W:1080,H:1920,capY:330,capS:66,capW:940,lap:{x:60,y:560,w:960},ph:{x:402,y:1292,w:276},tS:124,tY:660,subS:48,tall:true};
const stage=document.getElementById('stage');
stage.style.width=L.W+'px';stage.style.height=L.H+'px';
document.body.style.width=L.W+'px';document.body.style.height=L.H+'px';

// ---------- geometry ----------
const lb=L.lap.w*0.022, liW=L.lap.w-2*lb, liH=liW*0.625, lS=liW/1000, lfH=liH+2*lb+lb*0.4;
const pb=L.ph.w*0.04, piW=L.ph.w-2*pb, pS=piW/300, piH=640*pS, pfH=piH+2*pb;

// ---------- small builders ----------
const wifiSvg=(id,size)=>`<svg id="${id}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke-linecap="round" stroke-width="2.4">
 <path class="w3" d="M2.5 9.2a14 14 0 0 1 19 0"/><path class="w2" d="M5.8 12.6a9.2 9.2 0 0 1 12.4 0"/><path class="w1" d="M9.1 16a4.6 4.6 0 0 1 5.8 0"/><circle class="w0" cx="12" cy="19.3" r="1.4" stroke="none"/></svg>`;
const appColors=['#3D7BFF','#1E9E63','#F2A93B','#E5484D','#8B5CF6','#0EA5B7','#2557D6','#F97316','#14B8A6','#EC4899','#64748B','#22C55E','#6366F1','#EAB308','#06B6D4','#A855F7'];
const photoGrads=['#FDBA74,#F472B6','#93C5FD,#3D7BFF','#86EFAC,#0EA5B7','#FDE68A,#F97316','#C4B5FD,#6366F1','#A7F3D0,#1E9E63','#FBCFE8,#E5484D','#BAE6FD,#2557D6','#FEF08A,#22C55E','#DDD6FE,#EC4899','#FED7AA,#E5484D','#CFFAFE,#06B6D4'];

function phoneApp(s){ // home grid -> Settings app (also used for the mirror)
  let icons='';
  for(let r=0;r<4;r++)for(let c=0;c<4;c++){const k=r*4+c;icons+=`<div class="appi" style="left:${30+c*66}px;top:${150+r*84}px;background:${appColors[k]}"></div>`}
  const rows=[['Network & internet','Wi-Fi, hotspot','#3D7BFF'],['Connected devices','Bluetooth, Pixlink','#1E9E63'],['Apps','Recent apps, default apps','#F2A93B'],['Notifications','History, conversations','#8B5CF6'],['Battery','82%','#22C55E'],['Display','Dark theme, font size','#0EA5B7'],['Sound & vibration','Volume, haptics','#EC4899'],['Wallpaper & style','Colours, icons','#F97316'],['Storage','64% used','#64748B']];
  let list='';rows.forEach((r,i)=>{list+=`<div class="row" style="top:${i*64}px"><i style="background:${r[2]}"></i>${r[0]}<small>${r[1]}</small>${i==5?`<div class="ma-tog" style="position:absolute;right:20px;top:20px;width:42px;height:24px;border-radius:12px;background:#C5CDDD"><div class="ma-knob" style="position:absolute;left:3px;top:3px;width:18px;height:18px;border-radius:50%;background:#fff"></div></div>`:''}</div>`});
  return `<div class="layer home ma-grid" style="inset:0">${icons}
   <div style="position:absolute;left:22px;top:536px;width:256px;height:44px;border-radius:22px;background:rgba(255,255,255,.75)"></div></div>
   <div class="layer ma-app" style="inset:0;background:#F7F9FF;transform-origin:122px 174px">
     <div style="position:absolute;left:20px;top:46px;font-size:26px;font-weight:700;letter-spacing:-.02em">Settings</div>
     <div style="position:absolute;left:0;top:96px;width:300px;height:544px;overflow:hidden"><div class="ma-list" style="position:absolute;left:0;top:0;width:300px">${list}</div></div>
   </div>
   <div class="ripple ma-tap" style="width:60px;height:60px"></div>
   <div class="sbar"><span>10:24</span><span>▾ ▮</span></div>`;
}
function homeScreen(){
  let dock='';for(let i=0;i<4;i++)dock+=`<div class="appi" style="left:${30+i*66}px;top:470px;background:${appColors[i*3]}"></div>`;
  return `<div style="position:absolute;left:0;top:96px;width:300px;text-align:center;font-size:72px;font-weight:300;letter-spacing:-.04em;color:#16213A">10:24</div>
  <div style="position:absolute;left:0;top:186px;width:300px;text-align:center;font-size:14px;font-weight:600;color:#33405E">Thursday, 12 November</div>${dock}
  <div style="position:absolute;left:22px;top:546px;width:256px;height:44px;border-radius:22px;background:rgba(255,255,255,.75)"></div>`;
}

// ---------- DOM ----------
let html=`
<div class="glow" id="g1" style="width:${L.W*0.9}px;height:${L.W*0.9}px;background:radial-gradient(circle,rgba(61,123,255,.16),rgba(61,123,255,0) 65%)"></div>
<div class="glow" id="g2" style="width:${L.W*0.8}px;height:${L.W*0.8}px;background:radial-gradient(circle,rgba(201,240,222,.55),rgba(201,240,222,0) 65%)"></div>`;

// opening titles
const tl=L.tall?[['t1','Your Pixel.',0],['t2','Your PC.',1],['t3','Linked.',2]]:[['t1','Your Pixel.',0],['t2','Your PC.',0],['t3','Linked.',0]];
if(L.tall){ tl.forEach(([id,txt,row])=>html+=`<div class="title" id="${id}" style="top:${L.tY+row*L.tS*1.08}px;font-size:${L.tS}px">${txt}</div>`); }
else { html+=`<div class="title" style="top:${L.tY}px;font-size:${L.tS}px"><span id="t1">Your Pixel.</span> <span id="t2">Your PC.</span> <span id="t3">Linked.</span></div>`; }
const subTop=L.tall?L.tY+3*L.tS*1.08+40:L.tY+L.tS*1.3;
html+=`<div class="title" id="tsub" style="top:${subTop}px;font-size:${L.subS}px;font-weight:500;color:var(--slate);letter-spacing:-.02em">Phone Link, built for Pixel.</div>`;

// closing values
const vals=[['v1','Free.'],['v2','Open source.'],['v3','Made for Pixel.']];
if(L.tall){vals.forEach(([id,txt],i)=>html+=`<div class="title" id="${id}" style="top:${L.tY+i*L.tS*1.08}px;font-size:${L.tS}px">${txt}</div>`)}
else{html+=`<div class="title" style="top:${L.tY+20}px;font-size:${L.tS}px">${vals.map(([id,txt])=>`<span id="${id}" style="display:inline-block">${txt}</span>`).join(' ')}</div>`}

// end card
const eY=L.tall?640:250, eI=L.tall?260:220;
html+=`<div id="end" class="a" style="left:0;top:${eY}px;width:${L.W}px;text-align:center">
 <img id="eIcon" src="icon.png" style="width:${eI}px;height:${eI}px;border-radius:${eI*0.23}px;box-shadow:0 30px 60px -20px rgba(37,87,214,.55)">
 <div id="eName" style="font-size:${L.tall?120:104}px;font-weight:700;letter-spacing:-.04em;margin-top:${L.tall?40:28}px">Pixlink</div>
 <div id="eBtn" style="display:inline-block;margin-top:${L.tall?44:26}px;background:var(--blue);color:#fff;font-size:${L.tall?46:36}px;font-weight:650;padding:${L.tall?'22px 56px':'16px 44px'};border-radius:999px;letter-spacing:-.01em">Download now</div>
 <div id="eUrl" style="margin-top:${L.tall?36:24}px;font-size:${L.tall?36:30}px;font-weight:500;color:var(--slate);letter-spacing:-.01em">github.com/FatalQuackers/pixlink</div>
</div>`;

// captions
const caps=[[5.5,8.85,'Everything on your phone, right on your PC.'],[9.2,16.85,'Link in seconds. Stay linked to every PC you use.'],[17.2,24.85,'Answer notifications without picking up your phone.'],[25.2,31.85,'Your phone screen, live. Click, swipe and type.'],[32.2,37.85,'No Wi-Fi? One click and you’re&nbsp;online.'],[38.2,43.85,'Take calls right from your PC.'],[44.2,49.7,'Photos and files, both ways.']];
caps.forEach((c,i)=>html+=`<div class="cap" id="cap${i}" style="left:${(L.W-L.capW)/2}px;top:${L.capY}px;font-size:${L.capS}px;width:${L.capW}px">${c[2]}</div>`);

// devices
html+=`<div id="devs" class="a" style="left:0;top:0;width:${L.W}px;height:${L.H}px;transform-origin:50% 60%">
<div id="lap" class="a" style="left:${L.lap.x}px;top:${L.lap.y}px;width:${L.lap.w}px">
 <div class="lapframe" style="width:${L.lap.w}px;height:${lfH}px;padding:${lb}px">
  <div class="lapscreen" style="width:${liW}px;height:${liH}px"><div id="lin" style="transform:scale(${lS})"></div></div>
 </div>
 <div class="lapbase a" style="left:${-L.lap.w*0.07}px;top:${lfH}px;width:${L.lap.w*1.14}px;height:${L.lap.w*0.028}px"></div>
</div>
<div id="ph" class="a" style="left:${L.ph.x}px;top:${L.ph.y}px">
 <div class="phframe" style="width:${L.ph.w}px;height:${pfH}px;padding:${pb}px;border-radius:${L.ph.w*0.15}px">
  <div class="phscreen" style="width:${piW}px;height:${piH}px;border-radius:${L.ph.w*0.12}px"><div id="pin" style="transform:scale(${pS})"></div>
   <div class="a" style="left:${piW/2-6*pS}px;top:${12*pS}px;width:${12*pS}px;height:${12*pS}px;border-radius:50%;background:#0B0E16;z-index:9"></div></div>
 </div>
</div></div>`;
stage.innerHTML=html;

// ---------- laptop internals ----------
const tiles=['Hotspot','Silence','Find phone','Clipboard','Mirror','Send file'];
let tilesH='';tiles.forEach((n,i)=>tilesH+=`<div class="tile" id="tile${i}" style="left:${16+(i%2)*113}px;top:${120+Math.floor(i/2)*68}px"><i></i>${n}</div>`);
const tabsN=['Notifications','Messages','Calls','Photos','Screen'];const tabX=[24,150,250,316,392];
let tabsH='';tabsN.forEach((n,i)=>tabsH+=`<span id="tab${i}" style="left:${tabX[i]}px">${n}</span>`);
let photosH='';for(let i=0;i<12;i++)photosH+=`<div class="photo pg" style="left:${24+(i%4)*157}px;top:${56+Math.floor(i/4)*130}px;width:145px;height:118px;background:linear-gradient(135deg,${photoGrads[i]})"></div>`;
const calls=[['Mum','Mobile · Yesterday','#EC4899'],['Alex','Mobile · Tuesday','#3D7BFF'],['Dentist','Missed · Monday','#F2A93B'],['Sam','Mobile · Monday','#1E9E63']];
let callsH='';calls.forEach((c,i)=>callsH+=`<div style="position:absolute;left:24px;top:${56+i*62}px;width:622px;height:54px;border-bottom:1px solid #EEF1F7">
 <div class="av" style="left:0;top:8px;background:${c[2]}">${c[0][0]}</div><div style="position:absolute;left:50px;top:9px" class="ct">${c[0]}</div><div style="position:absolute;left:50px;top:29px" class="meta">${c[1]}</div></div>`);

document.getElementById('lin').innerHTML=`
<div class="wall"></div>
<div id="win">
 <div class="tbar"><img src="icon.png">Pixlink<span class="dots"><span>–</span><span>□</span><span>✕</span></span></div>
 <div class="layer" id="wSplash" style="left:0;top:34px;width:920px;height:514px;text-align:center">
   <img src="icon.png" style="width:110px;height:110px;border-radius:26px;margin-top:150px"><div style="font-size:32px;font-weight:700;letter-spacing:-.03em;margin-top:18px">Pixlink</div>
   <div style="font-size:14px;color:var(--slate);margin-top:8px">Your Pixel, on your PC</div></div>
 <div class="layer" id="wPair" style="left:0;top:34px;width:920px;height:514px;text-align:center">
   <div style="font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:110px">Link your phone</div>
   <div style="font-size:15px;color:var(--slate);margin-top:10px">On your Pixel, open Pixlink and type this code</div>
   <div style="display:flex;gap:14px;justify-content:center;margin-top:34px">${'48217'.split('').map(d=>`<div style="width:70px;height:88px;border-radius:14px;background:#EEF2FA;font-size:46px;font-weight:700;line-height:88px">${d}</div>`).join('')}</div>
   <div style="font-size:13px;color:#7C86A0;margin-top:26px">or scan the QR code</div></div>
 <div class="layer" id="wPairOk" style="left:0;top:34px;width:920px;height:514px;text-align:center;background:#FBFCFE">
   <div id="okCircle" style="width:110px;height:110px;border-radius:50%;background:var(--green);margin:150px auto 0;display:flex;align-items:center;justify-content:center">
    <svg width="58" height="58" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path id="okTick" d="M5 12.5l4.5 4.5L19 7.5" stroke-dasharray="24" stroke-dashoffset="24"/></svg></div>
   <div style="font-size:28px;font-weight:700;letter-spacing:-.02em;margin-top:24px">Linked to Pixel 9</div></div>
 <div class="layer" id="wMain" style="left:0;top:0;width:920px;height:548px">
  <div class="layer side">
   <div style="position:absolute;left:18px;top:20px;width:38px;height:70px;border:3px solid var(--navy);border-radius:9px"></div>
   <div style="position:absolute;left:70px;top:22px;font-size:19px;font-weight:700;letter-spacing:-.01em">Pixel 9</div>
   <div style="position:absolute;left:70px;top:48px;font-size:12px;color:var(--green);font-weight:600">● Connected</div>
   <div style="position:absolute;left:70px;top:68px;font-size:12px;color:var(--slate)">Battery 82%</div>
   ${tilesH}
   <div id="drop" style="position:absolute;left:16px;top:420px;width:218px;height:76px;border:2px dashed #C3CDE0;border-radius:12px;text-align:center;font-size:12px;font-weight:600;color:#7C86A0;padding-top:16px">Drop files to send<br><span style="font-weight:500">to Pixel 9</span>
     <div id="dropBar" style="position:absolute;left:16px;bottom:12px;width:182px;height:6px;border-radius:3px;background:#DCE3F0;overflow:hidden"><div id="dropFill" style="height:6px;width:0;background:var(--blue)"></div></div></div>
  </div>
  <div class="tabs">${tabsH}<div id="tabLine"></div></div>

  <div class="layer panel" id="pNotif">
   <div class="h" style="position:absolute;left:24px;top:18px">Notifications</div>
   <div class="card" id="cSam" style="top:52px;height:72px">
     <div class="av" style="left:16px;top:18px;background:#1E9E63">S</div>
     <div class="meta" style="position:absolute;left:64px;top:12px">Messages · now</div>
     <div class="ct" style="position:absolute;left:64px;top:27px">Sam</div>
     <div class="cx" id="samLine" style="position:absolute;left:64px;top:46px">Are you still coming tonight?</div>
     <div id="samExp" style="position:absolute;left:0;top:70px;width:622px;height:240px">
       <div class="bub" style="left:64px;top:4px;background:#EEF2FA">Dinner at 7?</div>
